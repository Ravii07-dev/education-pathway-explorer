# ===================================================================
#  Education Pathway Explorer - Application & Database Configuration
# ===================================================================

server.port=8080
spring.application.name=education-pathway-explorer-backend

# -------------------------------------------------------------------
#  MongoDB Configuration
# -------------------------------------------------------------------
# OPTION 1: Local MongoDB (Community Server / Docker)
spring.data.mongodb.uri=mongodb://localhost:27017/education_pathway

# OPTION 2: Free Cloud MongoDB Atlas (Uncomment and paste your URI)
# spring.data.mongodb.uri=mongodb+srv://<username>:<password>@cluster0.xxxxx.mongodb.net/education_pathway?retryWrites=true&w=majority

# Auto-seed the database with all 20+ courses, 35+ careers, 13+ entrance exams if collections are empty
app.mongodb.seed=true

# -------------------------------------------------------------------
#  CORS & Security Settings
# -------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true
